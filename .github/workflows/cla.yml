# Contributor License Agreement check.
#
# External setup required before making the "CLA Assistant" status a required
# check:
#   1. Create the PRIVATE `juggler-ai/cla-signatures` repository with a `main`
#      branch. Do not create the JSON signature file; the action creates it.
#   2. Add a fine-grained token as `CLA_SIGNATURES_TOKEN`. Restrict it to
#      Contents: read/write on that private repository only.
#   3. Protect the signature repository against force-push and deletion, limit
#      access, retain backups, and preserve its audit log.
#   4. Test an unsigned and signed fork PR, then require the exact status emitted
#      by the action in the `main` ruleset. Also require DCO and CI. Avoid routine
#      administrator bypasses.
#
# SECURITY: this privileged pull_request_target workflow must never check out,
# execute, or interpolate code from the pull request. The action is pinned to
# the commit behind v2.6.1; review that pin before updating it.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    # issue_comment also fires for issues. Run only for PR comments containing a
    # supported command, or for a pull_request_target event.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read and agree to Juggler Individual Contributor License Agreement version 1.0 (SHA-256 4cd25fec467ecfc7f5b318e73308e30dfa64c7ff87c9a342a892ce744467dc54) and I hereby sign it electronically'))
    runs-on: ubuntu-latest
    steps:
      - name: Check ICLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          custom-pr-sign-comment: 'I have read and agree to Juggler Individual Contributor License Agreement version 1.0 (SHA-256 4cd25fec467ecfc7f5b318e73308e30dfa64c7ff87c9a342a892ce744467dc54) and I hereby sign it electronically'
          custom-notsigned-prcomment: 'Thank you for contributing. Please read [Juggler ICLA version 1.0](https://github.com/juggler-ai/juggler/blob/main/CLA.md), then post the exact statement below from your own GitHub account. If an employer or another entity may own this work, also tell the maintainer so private CCLA coverage can be arranged.'
          custom-allsigned-prcomment: 'All individual contributors have signed Juggler ICLA version 1.0. Thank you! Corporate coverage, when applicable, is verified separately.'

          # Private, version-specific evidence store. Never reuse this path for a
          # materially amended agreement; create a new agreement and ledger path.
          remote-organization-name: juggler-ai
          remote-repository-name: cla-signatures
          branch: main
          path-to-signatures: signatures/juggler-icla-v1.0.json

          # CLA.md version 1.0 states that its versioned text will not be altered
          # in place. Git history preserves the exact text presented at signing.
          path-to-document: 'https://github.com/juggler-ai/juggler/blob/main/CLA.md'

          # The owner is the receiving party, not an outside contributor. Only
          # explicitly reviewed dependency bots are exempt; never use a bot
          # wildcard here.
          allowlist: 'julianstorer,dependabot[bot],dependabot-preview[bot]'

          # Preserve public corroboration of assent after a PR is merged.
          lock-pullrequest-aftermerge: true
