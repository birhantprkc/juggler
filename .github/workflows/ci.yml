name: CI

# Sanity CI only: does the tree lint, build, and pass tests?
#
# SECURITY INVARIANTS — this repo is public and PR code is untrusted:
#   * No secrets are referenced anywhere in this workflow, ever.
#   * GitHub-hosted runners ONLY — never self-hosted. (The old workflow's
#     self-hosted Mac has been re-registered with the private release repo;
#     the public CI now uses hosted macos-latest instead.)
#   * No packaging, no releases, no artifact publishing. Official binaries are
#     built and published by the maintainer's private release pipeline.
on:
  # PRs get green/red feedback automatically, on hosted (ephemeral) runners.
  # Everything else is on demand: a maintainer starts a run against any branch
  # from the Actions tab (or `gh workflow run ci.yml --ref <branch>`) when they
  # want the full matrix on a tree that is not in a PR — typically the
  # development branch before it is published. There is deliberately no branch
  # push trigger: branch updates here fast-forward an already-verified tree, so
  # a push-triggered run would only ever re-test what a PR or a manual run has
  # just tested. And deliberately nothing else — no tags, no releases.
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands on the same ref/PR, so
# a rapid push sequence doesn't pile up parallel matrix runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the tree.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Generous over the browser-suite timeout (30m on Linux, 15m elsewhere) to
    # leave room for the checkout (large wails submodule) and build. The
    # go-test timeout must be the one that fires: it panics with a goroutine
    # dump naming the in-flight tests, whereas a runner-level cancellation
    # kills the job with no diagnostic at all.
    timeout-minutes: 45
    strategy:
      # Don't cancel sibling matrix legs on first failure — each platform
      # surfaces different issues (build-tag drift, line endings, cgo/WKWebView
      # specifics) and seeing all of them at once is more useful than one.
      fail-fast: false
      matrix:
        include:
          # The Linux leg is the full behavioural gate: lint, build, Go package
          # tests, and the complete browser test suite.
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          # macOS rounds out the full trio of hosted platforms. Public repos
          # get hosted-mac minutes for free, so there's no cost reason to skip
          # it — and it catches darwin-only build-tag / cgo (WKWebView) drift
          # that Linux and Windows can't surface. (Packaging/signing still
          # lives in the private release pipeline; this leg just builds +
          # lints + tests.)
          - name: macos
            os: macos-latest

    steps:
      - name: Configure Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          # The 3rdparty/wails submodule is a large fork; cloning its full
          # history over HTTP/2 intermittently dies mid-transfer with
          # "curl 92 HTTP/2 stream not closed cleanly: CANCEL (err 8)" →
          # early EOF / index-pack failed. actions/checkout retries and
          # eventually succeeds, but it burns ~10min/attempt and raises scary
          # annotations on a green run. HTTP/1.1 + a large transfer buffer is
          # the documented workaround for these large-pack fetch cancellations.
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Module/build caching is on by default and always wanted here: every
          # runner is an ephemeral hosted VM whose caches vanish with it.

      - name: Download Go modules
        run: go mod download

      # Node 22+ is required: it is the engine-host floor (enginehost.MinNodeMajor
      # — Node 22 is the first release with a stable WebSocket global), so it is
      # what TestNodeEngineHostBootsAndConnects probes. On an older Node that test
      # skips and the node engine host goes untested; keep this at/above the floor.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install
        working-directory: tooling

      # WebKitGTK/GTK4/libsoup dev headers for the cgo Wails v3 Linux backend.
      # The server (hidden engine WebView) and the desktop app both link
      # against these.
      # xvfb: the browser suite spawns bin/juggler, a Wails/WebKitGTK app whose
      # hidden engine WebView needs an X display even in --test mode. Hosted
      # Linux runners are headless, so the suite runs under a virtual framebuffer
      # (see the "Run tests" step). macOS (WKWebView) / Windows (WebView2) don't.
      #
      # mesa software-GL drivers (libgl1-mesa-dri = swrast/llvmpipe, libegl-mesa0
      # = software EGL): WebKitGTK's WebProcess still needs a GL/EGL context to
      # composite even with the DMABUF renderer disabled. Under Xvfb there is no
      # hardware GL, and LIBGL_ALWAYS_SOFTWARE=1 (see "Run tests") only helps if a
      # software driver is actually installed — the base runner image doesn't
      # guarantee one, and without it the WebProcess can't create a context and
      # hangs before it runs the harness JS (the /api/test/names timeout), with no
      # libEGL warning because the driver isn't even present to emit one.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev xvfb libgl1-mesa-dri libegl-mesa0

      # Single lint entry point: identical to `make lint` locally, so a
      # contributor who passes lint at their terminal also passes CI lint.
      - name: Run linters
        shell: bash
        run: make lint

      # Plain unstamped builds: this workflow ships nothing, so the release
      # pipeline's version/commit ldflags stamping is deliberately absent.
      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          # Regenerate the go:embed source files from their assets/ sources
          # (cmd/juggler/icon.png is gitignored, so absent on a fresh checkout).
          # `make lint` above also does this as a side effect, but the build is
          # what actually depends on it — keep it explicit here.
          make app-icon-embed wails-runtime-embed
          # bin/juggler is what the browser test suite spawns, so the tests
          # below exercise the very binary we just built. On Windows the output
          # must be named .exe: `go build -o` writes the name verbatim (no auto
          # .exe on a Windows target) and Windows can't exec an extension-less
          # file — the harness's serverBinary() resolves the same name.
          EXE=""
          [ "${RUNNER_OS}" = "Windows" ] && EXE=".exe"
          go build -o "bin/juggler${EXE}" ./cmd/juggler
          go build -o "bin/juggler-test${EXE}" ./cmd/juggler-test

      # The Linux desktop app (GTK), built on every run as a continuous
      # compile-regression guard: juggler-app's Linux build is new, so a break
      # should surface on the first offending push.
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        shell: bash
        run: go build -o bin/juggler-app ./cmd/juggler-app

      # Go package unit tests (claudecode provider, worker, etc.) — ~75s under
      # -race. Kept a separate step from the browser suite so the CI log names
      # which layer broke. Use -count=1 (not -short): -short makes these suites'
      # TestMain/guards self-skip, which silently turned this gate into a no-op.
      # Match `make test-go` exactly so CI can't drift weaker than local.
      - name: Run Go package tests
        shell: bash
        run: go test -count=1 -race -timeout 5m ./cmd/...

      # Browser test suite: drives the WebKitGTK engine inside a spawned
      # bin/juggler. -count=1 (not -short) is load-bearing — under -short the
      # whole suite self-skips (browser_suite_test.go / main_test.go TestMain),
      # so this is the step that actually exercises the behavioural gate.
      # On Linux the spawned server needs a display, so run under xvfb; other
      # platforms render headless. Full output lands in the step log.
      #
      # JUGGLER_TEST_IFRAMES=4 (default 9): the pool runs N concurrent test
      # lanes against ONE shared WebKit engine (main_test.go). The default 9 is
      # tuned for a dev workstation; a hosted CI runner (~2-4 vCPU) can't service
      # 9 lanes on one engine, and starves them into failures that look like bugs
      # but are pure load — lanes whose engine WS can't connect within 30s, tests
      # that blow a 10s budget by a few ms, and an interrupted lane leaking state
      # into the next test's preconditions. 4 lanes keeps real server-side
      # concurrency coverage while fitting the runner. Local `make test` keeps
      # the full 9-lane stress. Raise if runners get beefier.
      - name: Run tests
        shell: bash
        env:
          JUGGLER_TEST_IFRAMES: 4
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # WebKitGTK 2.4x+ (2.52 on the runner) defaults to a DMABUF/GPU
            # renderer whose EGL init needs DRI3, which Xvfb's software
            # framebuffer can't provide ("libEGL warning: DRI3 error"). Without
            # a fallback the hidden-engine WebView hangs before it loads the
            # harness JS, so /api/test/names never responds and the suite times
            # out at 30s. Force the software path so the engine boots headless.
            # These vars only affect WebKitGTK/Mesa; harmless on other backends.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            export LIBGL_ALWAYS_SOFTWARE=1
            # WebKitGTK isolates its WebProcess in a bubblewrap (bwrap) sandbox
            # that needs unprivileged user namespaces + loopback setup. The
            # hosted runner denies those ("bwrap: loopback: Failed RTM_NEWADDR:
            # Operation not permitted"), so the WebProcess dies before handing
            # back credentials and the whole engine aborts on a fatal GLib
            # ERROR (SIGTRAP in g_application_run) — the engine never boots, so
            # /api/test/names times out at 30s. Disabling the sandbox is the
            # supported CI escape hatch (safe here: we only ever load our own
            # local test harness, never untrusted web content).
            export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
            # -v and the wider timeout are Linux-only diagnostics. The suite is
            # several times slower under Xvfb/WebKitGTK than on the macOS and
            # Windows legs, so it needs the headroom; and since the integration
            # tests are a single package, -v streams each subtest's PASS/FAIL
            # and duration into the step log as it runs. Without -v, a timeout
            # panic discards all buffered output, leaving no record of which
            # tests were slow or whether any of them also failed.
            xvfb-run -a --server-args='-screen 0 1920x1080x24' \
              go test -count=1 -race -v -timeout 30m ./tests/integration/...
          else
            go test -count=1 -race -timeout 15m ./tests/integration/...
          fi

      # Diagnostics on a browser-suite failure. Each spawned bin/juggler pipes
      # its stderr — the WebKitGTK/libEGL/WebProcess-crash output that never
      # reaches the go-test log — to /tmp/juggler-test-logs/juggler-stderr-*.log
      # (see startJugglerSubprocess in tests/integration/main_test.go). That
      # directory is a fixed path, not the run's throwaway log dir, so it
      # survives the pool shutdown. Without this, a hung WebView surfaces only as
      # an opaque "timeout polling /api/test/names" and every fix is a blind
      # guess; dumping the real engine stderr here is what makes the failure
      # diagnosable. Linux-only: it's the leg that drives WebKitGTK under Xvfb.
      - name: Dump engine stderr on failure
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        run: |
          shopt -s nullglob
          logs=(/tmp/juggler-test-logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no subprocess stderr logs found in /tmp/juggler-test-logs/"
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "===== ${f} ====="
            cat "${f}" || true
            echo
          done
